<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:40px;">
            <tr>
              <td style="font-size:20px;font-weight:bold;color:#111827;padding-bottom:16px;">
                Sit We Go
              </td>
            </tr>
            <tr>
              <td style="font-size:15px;color:#374151;line-height:1.5;padding-bottom:24px;">
                Use the verification code below to continue. It expires in
                {{ expiry_minutes }} minutes.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <div style="font-size:34px;font-weight:bold;letter-spacing:8px;color:#111827;background:#f3f4f6;border-radius:8px;padding:16px 0;">
                  {{ code }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;color:#9ca3af;line-height:1.5;">
                If you didn't request this, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
